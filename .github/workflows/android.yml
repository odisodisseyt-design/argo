name: ARGO Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'version.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > mobile/android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > mobile/android/keystore.properties

      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://v3310666.hosted-by-vdsina.ru
          EXPO_PUBLIC_WS_URL: wss://v3310666.hosted-by-vdsina.ru
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.1 \
            mobile/android/app/build/outputs/apk/release/app-release.apk \
            --title "Арго 0.1.1 — OTA-обновления" \
            --notes "Кнопка обновления в настройках: докачивает только код и ассеты через Expo Updates. Исправлен запуск и адрес сервера." ||
          gh release upload v0.1.1 mobile/android/app/build/outputs/apk/release/app-release.apk --clobber
